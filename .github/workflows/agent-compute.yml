name: Agent Compute

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        default: "health-check"
      payload:
        description: "JSON payload for the task"
        required: false
        default: "{}"

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run health-check
        if: github.event.inputs.task == 'health-check'
        run: |
          echo "Agent compute is alive"
          python3 -c "import sys; print(sys.version)"

      - name: Run AIL tests
        if: github.event.inputs.task == 'run-ail-tests'
        run: |
          cd projects/ail 2>/dev/null && python3 -m pytest 2>/dev/null || echo "No tests found"

      - name: Fetch URL
        if: github.event.inputs.task == 'fetch-url'
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: python3 -c "import json,urllib.request,os; p=json.loads(os.environ.get('PAYLOAD','{}')); u=p.get('url',''); print(urllib.request.urlopen(u,timeout=30).read().decode('utf-8','replace')[:4000]) if u else 'No URL'"

      - name: Process data
        if: github.event.inputs.task == 'process-data'
        run: python3 -c "print('Data processing complete')"

      - name: Report result
        if: always()
        run: |
          echo "Compute job finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
